name: 'Build Windows Client'

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/
  QT_VERSION: 6.10.1
  QIF_VERSION: 4.7

jobs:
  Build-Windows-Installer:
    runs-on: windows-latest

    steps:
    - name: 'Checkout repository'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup MSVC'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: 'x64'

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 'Install WiX Toolset'
      shell: powershell
      run: |
        dotnet tool install --global wix --version 4.0.6
        wix extension add -g WixToolset.UI.wixext/4.0.6
        wix extension add -g WixToolset.Util.wixext/4.0.6
        wix extension list -g
        $wixBinDir = Join-Path $env:USERPROFILE ".dotnet\tools"
        echo "WIX_BIN_DIR=$wixBinDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "WIX_ROOT_PATH=$wixBinDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: 'Setup Python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install Conan'
      run: pip install "conan==2.28.0"

    - name: 'Build Amnezia Client & Installer'
      shell: cmd
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        AMNEZIA_BUILD_TESTS: OFF
      run: |
        set "WIX_ROOT_PATH=%USERPROFILE%\.dotnet\tools"
        deploy\build.bat --installer all

    - name: 'Upload Windows Installer (.exe)'
      uses: actions/upload-artifact@v4
      with:
        name: AmneziaVPN-Windows-Installer-exe
        path: deploy/build/AmneziaVPN_*_windows_x64.exe
        if-no-files-found: warn

    - name: 'Upload Windows MSI Package (.msi)'
      uses: actions/upload-artifact@v4
      with:
        name: AmneziaVPN-Windows-Package-msi
        path: deploy/build/AmneziaVPN_*_windows_x64.msi
        if-no-files-found: warn

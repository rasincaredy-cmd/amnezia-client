name: 'Build Android APK'

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/
  QT_VERSION: 6.10.1
  ANDROID_PLATFORM: android-30
  NDK_VERSION: 27.0.11718014

jobs:
  Build-Android-APK:
    runs-on: ubuntu-24.04

    steps:
    - name: 'Checkout repository'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Setup Java 17'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 'Setup Android SDK & NDK'
      uses: android-actions/setup-android@v4
      with:
        packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

    - name: 'Setup Python'
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 'Install Conan'
      run: pip install "conan==2.28.0"

    - name: 'Install Desktop Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install Android ARM64 Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'all_os'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup Keystore for Signing'
      run: |
        keytool -genkeypair -v \
          -keystore ${{ github.workspace }}/android.keystore \
          -alias moschata \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "moschata123" \
          -keypass "moschata123" \
          -dname "CN=MoschataVPN, OU=Moschata, O=Moschata, L=Perm, ST=Perm, C=RU"

    - name: 'Build Android APK'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android.keystore
        QT_ANDROID_KEYSTORE_ALIAS: moschata
        QT_ANDROID_KEYSTORE_STORE_PASS: moschata123
        APP_ANDROID_MIN_SDK: 30
        APP_ANDROID_MAX_SDK: ''
        APP_ANDROID_VERSION_CODE_OFFSET: 1
        AMNEZIA_BUILD_TESTS: OFF
      run: |
        export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        ./deploy/build.sh -t android --abi arm64-v8a --sign

    - name: 'Collect APK Artifacts'
      run: |
        mkdir -p deploy/artifacts
        find deploy/build/client/android-build -name "*.apk" -exec cp -v {} deploy/artifacts/ \;
        ls -la deploy/artifacts/

    - name: 'Upload Android APK'
      uses: actions/upload-artifact@v4
      with:
        name: MoschataVPN-Android-arm64-v8a
        path: deploy/artifacts/*.apk
        if-no-files-found: error
